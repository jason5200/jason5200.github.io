<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Jason 的码上座舱 | 车载 Android · Framework · AI 技术博客</title>
  <meta name="description" content="车载 Android（AAOS）· Android Framework 源码精读 · AI 应用落地的技术博客，带你从源码到座舱，把技术讲透、做透。">
  <meta name="keywords" content="车载Android,AAOS,Android Framework,Binder,Handler,CarService,智能座舱,AI上车,大模型">
  <meta name="author" content="jason5200">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Jason 的码上座舱">
  <meta property="og:description" content="车载 Android · Android Framework · AI 应用落地的技术博客">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="assets/custom.css">
</head>
<body>
  <!-- 阅读进度条 -->
  <div id="reading-progress"></div>

  <div id="app">加载中...</div>

  <script>
    window.$docsify = {
      name: 'Jason 的码上座舱 🚗',
      repo: 'https://github.com/jason5200/jason5200.github.io',
      loadSidebar: true,
      subMaxLevel: 3,
      coverpage: true,
      auto2top: true,
      relativePath: false,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/middleware': '/articles/00-overview/middleware.md',
        '/middleware.md': '/articles/00-overview/middleware.md',
        '/aaos-intro': '/articles/00-overview/aaos-intro.md',
        '/aaos-intro.md': '/articles/00-overview/aaos-intro.md'
      },
      themeColor: '#0074d9',
      search: {
        placeholder: '搜索文章',
        noData: '没有找到结果',
        depth: 4
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: false
      },
      plugins: [
        function (hook) {
          var footer = [
            '<hr/>',
            '<footer style="text-align:center;color:#6a737d;font-size:13px;padding:16px 0;">',
            '© 2026 <a href="https://github.com/jason5200" target="_blank">jason5200</a> · ',
            'Powered by <a href="https://docsify.js.org" target="_blank">Docsify</a> · ',
            '<a href="https://github.com/jason5200/jason5200.github.io" target="_blank">博客源码</a>',
            '</footer>'
          ].join('');

          // 单个 afterEach：加 footer + 把 mermaid 代码块转成 div.mermaid
          // 完全对齐官方 docsify-mermaid 插件写法（next 回调）
          hook.afterEach(function (html, next) {
            html = html + footer;
            var wrap = document.createElement('div');
            wrap.innerHTML = html;
            wrap.querySelectorAll('pre[data-lang=mermaid]').forEach(function (pre) {
              var div = document.createElement('div');
              div.className = 'mermaid';
              div.textContent = pre.textContent;
              pre.parentNode.replaceChild(div, pre);
            });
            next(wrap.innerHTML);
          });

          hook.doneEach(function () {
            if (window.mermaid) {
              mermaid.run({ querySelector: '.mermaid' });
            }

            if (window.__docsifyAbsRoute) {
              document.querySelectorAll('a[href]').forEach(function (a) {
                var href = a.getAttribute('href') || '';
                if (href.indexOf('..') === -1 && href.indexOf('#/middleware') === -1) return;
                var route = window.__docsifyAbsRoute(href);
                if (route) a.setAttribute('href', '#/' + route);
              });
            }

            var h1 = document.querySelector('.markdown-section h1');
            if (h1) {
              var title = h1.textContent.trim();
              document.title = title + ' | Jason 的码上座舱';
              var ogTitle = document.querySelector('meta[property="og:title"]');
              if (ogTitle) ogTitle.setAttribute('content', title);
              var ogUrl = document.querySelector('meta[property="og:url"]');
              if (ogUrl) ogUrl.setAttribute('content', 'https://jason5200.github.io' + location.hash);
              var canonical = document.querySelector('link[rel="canonical"]');
              if (canonical) canonical.setAttribute('href', 'https://jason5200.github.io' + location.hash);
            }
          });
        }
      ]
    };
  </script>

  <script>
    // Docsify hash 路由不会解析 .. 。分页「下一篇」会生成 #/../xxx，这里统一纠正。
    (function () {
      var shorts = {
        middleware: 'articles/00-overview/middleware',
        'aaos-intro': 'articles/00-overview/aaos-intro'
      };
      var folders = {
        'car-service': 1, 'carservice-api': 1, audio: 1, permission: 1,
        '00-overview': 1, framework: 1, ai: 1, rag: 1, perf: 1, ota: 1,
        'multi-display': 1, agent: 1, multimodal: 1, mtk: 1
      };

      function absRoute(href) {
        var raw = String(href || '').replace(/^#\/?/, '').replace(/\.md$/, '');
        if (!raw) return '';
        if (shorts[raw]) return shorts[raw];
        if (raw.indexOf('..') === -1) return raw;
        var parts = raw.split('/');
        var stack = [];
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (!p || p === '.') continue;
          if (p === '..') {
            stack.pop();
            continue;
          }
          stack.push(p);
        }
        if (stack[0] && folders[stack[0]]) stack.unshift('articles');
        return stack.join('/');
      }

      window.__docsifyAbsRoute = absRoute;

      function fixLocationHash() {
        var hash = location.hash || '';
        var raw = hash.replace(/^#\/?/, '').replace(/\.md$/, '');
        if (!raw) return;
        if (raw.indexOf('..') === -1 && !shorts[raw]) return;
        var next = absRoute(hash);
        if (next && next !== raw) location.replace('#/' + next);
      }

      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '';
        if (href.indexOf('..') === -1 && href.indexOf('#/middleware') === -1 && href.indexOf('#/aaos-intro') === -1) return;
        var route = absRoute(href);
        if (!route) return;
        e.preventDefault();
        location.hash = '#/' + route;
      }, true);

      window.addEventListener('hashchange', fixLocationHash);
      fixLocationHash();
    })();
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Mermaid：UMD 完整版 -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
    }
  </script>

  <script>
    // 阅读进度条
    document.addEventListener('scroll', function () {
      var scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
      var scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
      var bar = document.getElementById('reading-progress');
      if (bar) bar.style.width = progress + '%';
    });
  </script>
